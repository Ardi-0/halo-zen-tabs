name: Validate Zen mod

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check halo-tabs.uc.js
      - run: node scripts/check-mod.mjs
      - run: node --test tests/*.test.cjs
